version: '3.8'

services:
  db:
    image: postgres:15
    container_name: planogram_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Malaika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Malmi1901}
      POSTGRES_DB: ${POSTGRES_DB:-planogram_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: planogram_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: planogram_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-Malaika}:${POSTGRES_PASSWORD:-Malmi1901}@db:5432/${POSTGRES_DB:-planogram_db}
      - REDIS_URL=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY:-your_super_secret_key_change_in_prod}

  worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: planogram_ml_worker
    restart: always
    command: celery -A backend.app.workers.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-Malaika}:${POSTGRES_PASSWORD:-Malmi1901}@db:5432/${POSTGRES_DB:-planogram_db}
      - REDIS_URL=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    deploy:
      resources:
        limits:
          memory: 4G # Prevent YOLO/PyTorch from crashing the host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planogram_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
